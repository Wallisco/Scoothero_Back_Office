# /etc/nginx/sites-available/scoothero-backoffice  (certbot adds the SSL lines)
limit_req_zone $binary_remote_addr zone=external_links:10m rate=20r/m;

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 25M;   # leases, COCs, invoices, phone photos

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Landlord and contractor links: rate-limited
    location ~ ^/(p|q|j)/ {
        limit_req zone=external_links burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;   # proposal generation
    }
}
